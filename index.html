<style>
:root{
  --bg:#01070d;
  --line:#46dcff; --line-2:rgba(70,220,255,.5); --line-3:rgba(70,220,255,.22); --line-4:rgba(70,220,255,.09);
  --hi:#ecfcff; --text:#c2eefb; --soft:#6a9fb3; --mute:#3d6678; --warn:#ff8f3f; --red:#ff5468;
  --ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --orb-bottom:56vh;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;font-family:var(--ui);color:var(--text);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(ellipse 80% 45% at 50% 34%,rgba(30,130,190,.2),transparent 70%),
    radial-gradient(ellipse 120% 40% at 50% 112%,rgba(14,70,110,.3),transparent 70%),
    var(--bg);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background:
    linear-gradient(var(--line-4) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,var(--line-4) 1px,transparent 1px) 0 0/32px 32px;
  -webkit-mask-image:radial-gradient(ellipse 90% 50% at 50% 34%,#000 5%,transparent 72%);
  mask-image:radial-gradient(ellipse 90% 50% at 50% 34%,#000 5%,transparent 72%);
}
#sphere{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.app{
  position:relative;height:100%;max-width:760px;margin:0 auto;pointer-events:none;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:0 max(14px,env(safe-area-inset-left,0px)) 12px max(14px,env(safe-area-inset-right,0px));
}
.app > *{pointer-events:auto}

/* ── 上部：名前・設定・計測値 ── */
.top{padding-top:10px;pointer-events:none}
.top .row{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:9px}
.brand h1{margin:0;font-size:.95rem;font-weight:500;letter-spacing:.5em;color:var(--hi);text-shadow:0 0 10px rgba(70,220,255,.6)}
.brand .tag{font-family:var(--mono);font-size:.56rem;color:var(--soft);padding:1px 5px;box-shadow:inset 0 0 0 1px var(--line-3)}
.tele{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:.58rem;line-height:1.7;color:var(--soft);font-variant-numeric:tabular-nums}
.tele span{color:var(--text)}
.tele i{font-style:normal;color:var(--mute)}
.tele .r{text-align:right}
.icon-btn{
  pointer-events:auto;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
  color:var(--soft);background:rgba(4,20,32,.5);border:0;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  box-shadow:inset 0 0 0 1px var(--line-3);
}
.icon-btn:hover{color:var(--hi)}
.icon-btn svg{width:18px;height:18px}

/* ── 字幕 ── */
.lower{display:flex;flex-direction:column;min-height:0;padding-top:var(--orb-bottom);pointer-events:none}
.status{text-align:center;flex:none}
.status b{display:inline-block;font-weight:400;font-size:.9rem;letter-spacing:.32em;padding-left:.32em;color:var(--hi);
  text-shadow:0 0 12px rgba(70,220,255,.75);font-variant-numeric:tabular-nums}
.status small{display:block;margin-top:2px;font-family:var(--mono);font-size:.58rem;color:var(--soft)}
.status.err b{color:#ffc5cc;text-shadow:0 0 12px rgba(255,84,104,.75)}
.captions{
  flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;
  padding:12px 6px 10px;text-align:center;pointer-events:auto;touch-action:pan-x;
}
.cap-user{font-size:.8rem;color:var(--soft);line-height:1.6;max-height:3.2em;overflow:hidden}
.cap-user:not(:empty)::before{content:"あなた　";color:var(--mute);font-size:.7rem}
.cap-ai{
  font-size:1.08rem;line-height:1.75;color:var(--hi);overflow-y:auto;max-height:100%;
  text-shadow:0 0 14px rgba(1,7,13,.9),0 0 2px rgba(1,7,13,1);
  white-space:pre-wrap;word-break:break-word;
}
.cap-ai.over{-webkit-mask-image:linear-gradient(transparent,#000 1.4em);mask-image:linear-gradient(transparent,#000 1.4em)}
.cap-ai.live::after{content:"";display:inline-block;width:.45em;height:1em;vertical-align:-.15em;margin-left:3px;background:var(--line);box-shadow:0 0 6px var(--line);animation:blink .9s steps(2) infinite}
.cap-more{
  align-self:center;font:inherit;font-size:.72rem;color:var(--line);cursor:pointer;border:0;padding:6px 12px;
  background:rgba(70,220,255,.08);box-shadow:inset 0 0 0 1px var(--line-3);
}
.cap-hint{font-size:.66rem;color:var(--mute);letter-spacing:.08em}
@keyframes blink{50%{opacity:0}}

/* ── 操作 ── */
.controls{display:grid;gap:8px}
.typebar{
  display:flex;gap:8px;align-items:flex-end;padding:6px;
  background:linear-gradient(180deg,rgba(12,42,64,.65),rgba(5,22,36,.72));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 0 0 1px var(--line-3);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.typebar[hidden]{display:none}
.typebar textarea{
  flex:1;min-height:42px;max-height:26vh;resize:none;border:0;outline:0;
  font:inherit;font-size:16px;line-height:1.5;color:var(--hi);padding:9px 10px;background:rgba(1,8,14,.55);
}
.typebar textarea::placeholder{color:var(--mute)}
.dock{display:flex;justify-content:center;align-items:center;gap:26px;padding:4px 0 2px;position:relative}
.dock::before{content:"";position:absolute;left:8%;right:8%;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--line-3) 20%,transparent 40%,transparent 60%,var(--line-3) 80%,transparent);pointer-events:none}
.key{
  flex:none;width:46px;height:46px;display:grid;place-items:center;cursor:pointer;border:0;position:relative;
  color:var(--line);background:linear-gradient(180deg,rgba(70,220,255,.12),rgba(70,220,255,.04));
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  box-shadow:inset 0 0 0 1px var(--line-2);transition:background .15s,color .15s;
}
.key svg{width:19px;height:19px}
.key:active:not(:disabled){background:rgba(70,220,255,.3)}
.key:disabled{opacity:.28;cursor:default}
.key.on{color:var(--bg);background:linear-gradient(180deg,#8eeaff,var(--line));box-shadow:none}
.key.primary{color:var(--bg);background:linear-gradient(180deg,#8eeaff,var(--line));box-shadow:none}
.key.primary:disabled{color:var(--line);background:linear-gradient(180deg,rgba(70,220,255,.12),rgba(70,220,255,.04));box-shadow:inset 0 0 0 1px var(--line-2)}
.key.stop{color:#1a0a00;background:repeating-linear-gradient(-45deg,var(--warn) 0 6px,#ffb27a 6px 12px);box-shadow:none}
/* 中央の大きなマイク：八角形 */
.key.mic{
  width:74px;height:74px;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
}
.key.mic svg{width:28px;height:28px}
.key.mic.convo{color:var(--bg);background:linear-gradient(180deg,#a8f0ff,var(--line));box-shadow:none}
.key.mic.live{color:var(--bg);background:var(--hi);animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{background:var(--line)}}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

/* ── 履歴の引き出し ── */
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:5;height:84%;max-width:760px;margin:0 auto;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(6,26,42,.97),rgba(2,12,20,.98));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 var(--line-2),0 -20px 60px rgba(0,0,0,.6);
  clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%,0 18px);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:none}
.drawer-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px 8px 18px;touch-action:none;cursor:grab}
.drawer-head::before{content:"";position:absolute;left:50%;top:7px;width:44px;height:3px;margin-left:-22px;background:var(--line-2)}
.drawer-head h2{margin:10px 0 0;font-size:.8rem;font-weight:500;letter-spacing:.35em;color:var(--hi)}
.drawer-head .icon-btn{margin-top:6px}
.shade{position:fixed;inset:0;z-index:4;background:rgba(1,5,10,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
#log{flex:1;min-height:0;overflow-y:auto;padding:10px 16px 20px;font-size:14.5px;line-height:1.75;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 22px;max-width:68ch}
.meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-family:var(--mono);font-size:.6rem;color:var(--mute);font-variant-numeric:tabular-nums}
.meta::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-3),transparent)}
.meta b{font-weight:400;color:var(--line)}
.msg.user{margin-left:auto;max-width:86%;width:fit-content}
.msg.user .meta{flex-direction:row-reverse}
.msg.user .meta::after{background:linear-gradient(270deg,var(--line-3),transparent)}
.msg.user .body{color:var(--hi);padding:9px 14px;background:linear-gradient(180deg,rgba(70,220,255,.13),rgba(70,220,255,.05));
  box-shadow:inset 0 0 0 1px var(--line-3),inset 3px 0 0 var(--line-2);
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.msg.note{font-family:var(--mono);font-size:.66rem;color:var(--soft);text-align:center;letter-spacing:.06em}
.msg.err{font-size:.82rem;color:#ffc5cc;padding:9px 12px;box-shadow:inset 2px 0 0 var(--red);background:rgba(255,84,104,.07)}
.body{white-space:pre-wrap;word-break:break-word}
.body code{font-family:var(--mono);font-size:.88em;color:var(--hi);background:rgba(70,220,255,.1);padding:1px 5px}

.codebox{margin:10px 0;white-space:normal;background:rgba(1,7,13,.8);box-shadow:inset 0 0 0 1px var(--line-3);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 10px;font-family:var(--mono);font-size:.64rem;color:var(--soft);
  background:repeating-linear-gradient(-45deg,rgba(70,220,255,.05) 0 4px,transparent 4px 8px);box-shadow:inset 0 -1px 0 var(--line-3)}
.codebox .bar span::before{content:"";display:inline-block;width:5px;height:5px;margin-right:7px;vertical-align:1px;background:var(--line);box-shadow:0 0 6px var(--line)}
.codebox pre{margin:0;padding:11px 12px;overflow-x:auto;white-space:pre;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#d6f6ff;tab-size:2}
.copy{font:inherit;font-size:.64rem;color:var(--line);background:none;border:0;padding:4px 8px;cursor:pointer}
.copy.done{color:var(--hi)}
.cursor::after{content:"";display:inline-block;width:.5em;height:1em;vertical-align:-.15em;margin-left:2px;background:var(--line);animation:blink .9s steps(2) infinite}
.empty{padding:40px 10px;text-align:center;color:var(--soft);font-size:.8rem;line-height:2}

/* ── 設定 ── */
dialog{
  width:min(92vw,440px);max-height:86vh;padding:0;border:0;color:var(--text);
  background:linear-gradient(180deg,rgba(8,32,50,.94),rgba(3,15,25,.96));

}
dialog::backdrop{background:rgba(1,5,10,.65)}

.sheet h2{margin:0;font-size:.85rem;font-weight:500;letter-spacing:.4em;color:var(--hi)}
.f label{display:block;font-size:.72rem;color:var(--soft);margin-bottom:6px}
.f select,.f textarea{width:100%;font:inherit;font-size:16px;color:var(--hi);border:0;border-radius:0;background:rgba(1,8,14,.7);box-shadow:inset 0 0 0 1px var(--line-3);padding:9px 10px}

<script type="module">
const $ = s => document.querySelector(s);

/* ══ 設定値 ══ */
const MODELS = [
  { base:"Qwen2.5-Coder-1.5B-Instruct", label:"標準（1.5B・約1GB）", short:"標準" },
  { base:"Qwen2.5-Coder-0.5B-Instruct", label:"軽量（0.5B・約0.4GB）", short:"軽量" },
  { base:"Qwen2.5-Coder-3B-Instruct",   label:"高性能（3B・約2GB、パソコン向け）", short:"高性能" },
];
const PROJECTS = [
  { key:"general", name:"指定なし", ctx:"" },
  { key:"block",   name:"ブロックゲーム", ctx:"スマホのブラウザで遊ぶマインクラフト風ブロックゲーム。" },
  { key:"monster", name:"モンスターRPG", ctx:"オリジナルのモンスター収集・育成RPG。ブラウザ版プロトタイプから開始し、Unity/C#への移行も候補。" },
  { key:"camera",  name:"構図ガイドカメラ", ctx:"スマホのカメラ映像に15種類の基本構図ガイドを重ねるWebアプリ。GitHub Pagesで公開。" },
  { key:"lifeplan",name:"家計の健康診断", ctx:"ライフプラン・家計診断のWebツール。GitHub Pagesで公開、広告収益での一般公開を準備中。" },
  { key:"watch",   name:"出店・発展度ウォッチ", ctx:"会津若松市のエリア別の出店・閉店・住宅・雇用・インフラの変化を可視化するWebサイト。" },
  { key:"chara",   name:"キャラクターサイト", ctx:"タッチに反応するアメコミ調キャラクターのWebサイト。2Dイラストをパーツ分けして動かす方式。" },
  { key:"agent",   name:"個人用AIエージェント", ctx:"音声/テキストで質問する個人用AIアプリ。iPhoneホーム画面用PWAをGitHub Pagesで公開、WebLLMで無料運用を目指す。" },
  { key:"birth",   name:"出産準備ガイド", ctx:"妊娠〜産後の手続き・給付金をまとめたWebサイト。全国の自治体を選べる。" },
];
const BASE_PROMPT =
  "あなたは個人開発者の相棒エンジニア「コア」です。日本語で簡潔に答えてください。" +
  "コードは省略せず、そのまま動く形で、言語名付きのコードブロックで示してください。" +
  "変更箇所だけで足りる場合は、どこを差し替えるかを明記してください。" +
  "確信がない内容は推測だと明示してください。";
const HISTORY_TURNS = 6;
const APP_VERSION = "2.0（全画面コア）";

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let webllm = null, engine = null, loadedId = null, f16 = false;
let phase = "off";
let projectKey = store.get("aibo:project", "general"), history = [];
const pad = (n, w) => String(Math.abs(Math.round(n))).padStart(w, "0");

/* ══ 粒子コアと計器 ═════════════════════════════ */
const sphere = (() => {
  const cv = $("#sphere"), g = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TAU = Math.PI * 2, N = innerWidth < 560 ? 640 : 1000;
  const pts = [];
  for (let i = 0; i < N; i++){
    const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    const a = Math.random() * TAU, b = Math.acos(2 * Math.random() - 1), d = 2 + Math.random() * 1.8;
    pts.push({ x:Math.cos(th)*r, y, z:Math.sin(th)*r,
      sx:Math.sin(b)*Math.cos(a)*d, sy:Math.cos(b)*d*.5, sz:Math.sin(b)*Math.sin(a)*d,
      seed:Math.random(), tw:Math.random() * TAU, k:1 });
  }
  // ジンバル（機械式の支持リング）
  const gimbals = [
    { r:1.28, tilt:Math.PI/2, yaw:0,   spd: .35, notches:8 },
    { r:1.42, tilt:0,         yaw:.5,  spd:-.22, notches:12 },
  ];
  const MODES = {
    off:    { speed:.10, radius:.86, bright:.4,  jitter:0,    gim:.35, scan:0,  frame:1.18, col:[70,220,255] },
    load:   { speed:.4,  radius:1,   bright:.8,  jitter:0,    gim:.7,  scan:1,  frame:1.1,  col:[70,220,255] },
    ready:  { speed:.16, radius:1,   bright:.9,  jitter:0,    gim:.6,  scan:0,  frame:1.1,  col:[70,220,255] },
    think:  { speed:.8,  radius:1.03,bright:1,   jitter:0,    gim:1,   scan:.6, frame:1.0,  col:[120,230,255] },
    listen: { speed:.25, radius:1.1, bright:1.05,jitter:.045, gim:.85, scan:0,  frame:.96,  col:[200,247,255] },
    speak:  { speed:.3,  radius:1.04,bright:1,   jitter:0,    gim:.85, scan:0,  frame:1.04, col:[150,236,255] },
    error:  { speed:.05, radius:.88, bright:.75, jitter:.015, gim:.25, scan:0,  frame:1.2,  col:[255,84,104] },
  };
  const S = { mode:"off", assemble:1, energy:0, rot:0, tilt:.36, vrot:0, vtilt:0, progress:0, gimRot:0, scanA:0, ...structuredClone(MODES.off) };
  const waves = [];
  let W = 0, H = 0, last = performance.now(), teleT = 0;

  let R0 = 80, RIc = 130, CY = 300;
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    R0 = Math.min(W * .26, H * .155);
    RIc = Math.min(R0 * 1.66, W * .46);
    CY = Math.max(RIc + 96, H * .33);
    // 計器リングの下端から字幕を始める（上部の余白・安全領域ぶんを差し引く）
    const top = document.querySelector(".top").getBoundingClientRect().bottom;
    document.documentElement.style.setProperty("--orb-bottom", Math.max(0, CY + RIc + 14 - top) + "px");
  }
  new ResizeObserver(resize).observe(cv); resize();

  let drag = null;
  cv.addEventListener("pointerdown", e => { drag = { x:e.clientX, y:e.clientY, moved:0 }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved += Math.abs(dx) + Math.abs(dy); drag.x = e.clientX; drag.y = e.clientY;
    S.vrot = dx * .012; S.vtilt = dy * .008;
    S.rot += dx * .01; S.tilt = Math.max(-1.1, Math.min(1.1, S.tilt + dy * .007));
  });
  cv.addEventListener("pointerup", () => { if (drag && drag.moved < 8) cv.dispatchEvent(new CustomEvent("tap")); drag = null; });
  cv.addEventListener("pointercancel", () => drag = null);

  const lerp = (a, b, t) => a + (b - a) * t;
  const proj = (x, y, z, cy, sy, cx, sx) => { const x1 = x*cy + z*sy, z1 = -x*sy + z*cy; return [x1, y*cx - z1*sx, y*sx + z1*cx]; };

  function frame(t){
    const dt = Math.min((t - last) / 1000, .05); last = t;
    const tg = MODES[S.mode], e = 1 - Math.pow(.025, dt);
    for (const k of ["speed","radius","bright","jitter","gim","scan","frame"]) S[k] = lerp(S[k], tg[k], e);
    for (let c = 0; c < 3; c++) S.col[c] = lerp(S.col[c], tg.col[c], e);
    S.energy *= Math.pow(.12, dt);
    const rm = reduce ? .2 : 1;
    if (!drag){
      S.rot += S.speed * dt * rm + S.vrot; S.vrot *= Math.pow(.05, dt);
      S.tilt += S.vtilt; S.vtilt *= Math.pow(.05, dt); S.tilt = lerp(S.tilt, .36, 1 - Math.pow(.4, dt));
    }
    S.gimRot += dt * rm * (.4 + S.speed * 1.6);
    S.scanA += dt * rm * 2.4;

    g.clearRect(0, 0, W, H);
    const bob = reduce ? 0 : Math.sin(t / 2200) * 4;
    const cxp = W / 2, cyp = CY + bob;
    const R = R0 * S.radius * (1 + (reduce ? 0 : Math.sin(t / 1500) * .012) + S.energy * .06);
    const RI = RIc;   // 計器リング（固定）
    const [cr, cg, cb] = S.col;
    const rgb = (a, m = 1) => `rgba(${Math.round(cr*m)},${Math.round(cg*m)},${Math.round(cb*m)},${a})`;
    const cy = Math.cos(S.rot), sy = Math.sin(S.rot), cx = Math.cos(S.tilt), sx = Math.sin(S.tilt);

    // 床の影
    g.save(); g.translate(cxp, CY + RI * .98); g.scale(1, .14);
    const fl = g.createRadialGradient(0, 0, 0, 0, 0, R * 1.3);
    fl.addColorStop(0, rgb(.2 * S.bright * (1 - bob / 25))); fl.addColorStop(1, rgb(0));
    g.fillStyle = fl; g.beginPath(); g.arc(0, 0, R * 1.3, 0, TAU); g.fill(); g.restore();

    // 芯の光
    const glow = g.createRadialGradient(cxp, cyp, 0, cxp, cyp, R * 1.7);
    glow.addColorStop(0, rgb(.14 * S.bright + S.energy * .14)); glow.addColorStop(.55, rgb(.035 * S.bright)); glow.addColorStop(1, rgb(0));
    g.fillStyle = glow; g.fillRect(0, 0, W, H);

    /* ── 計器リング：目盛り・方位・指針 ── */
    g.lineCap = "butt";
    const ringY = CY;
    g.strokeStyle = rgb(.18); g.lineWidth = 1;
    g.beginPath(); g.arc(cxp, ringY, RI, 0, TAU); g.stroke();
    g.beginPath(); g.arc(cxp, ringY, RI - 9, 0, TAU); g.strokeStyle = rgb(.08); g.stroke();
    for (let i = 0; i < 120; i++){
      const a = i / 120 * TAU - Math.PI / 2, major = i % 10 === 0, mid = i % 5 === 0;
      const l = major ? 8 : mid ? 5 : 2.5;
      g.strokeStyle = rgb(major ? .7 : mid ? .4 : .22); g.lineWidth = major ? 1.3 : 1;
      g.beginPath();
      g.moveTo(cxp + Math.cos(a) * RI, ringY + Math.sin(a) * RI);
      g.lineTo(cxp + Math.cos(a) * (RI - l), ringY + Math.sin(a) * (RI - l));
      g.stroke();
    }
    g.font = `500 8px ui-monospace,Menlo,monospace`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = rgb(.55);
    for (let d = 0; d < 360; d += 90){
      if (d === 180) continue;            // 下はステータス表示の場所
      const a = d / 360 * TAU - Math.PI / 2, rr = RI + 10;
      g.fillText(pad(d, 3), cxp + Math.cos(a) * rr, ringY + Math.sin(a) * rr);
    }
    // 指針：球の回転角を示す
    const pa = ((S.rot % TAU) + TAU) % TAU - Math.PI / 2;
    g.fillStyle = rgb(.95);
    g.beginPath();
    g.moveTo(cxp + Math.cos(pa) * (RI - 11), ringY + Math.sin(pa) * (RI - 11));
    g.lineTo(cxp + Math.cos(pa + .045) * (RI - 19), ringY + Math.sin(pa + .045) * (RI - 19));
    g.lineTo(cxp + Math.cos(pa - .045) * (RI - 19), ringY + Math.sin(pa - .045) * (RI - 19));
    g.fill();
    // 読込の進捗：外周を太線で
    if (S.mode === "load" || S.progress > 0 && S.progress < 1){
      g.strokeStyle = rgb(.9); g.lineWidth = 2.5;
      g.beginPath(); g.arc(cxp, ringY, RI + 3, -Math.PI / 2, -Math.PI / 2 + TAU * S.progress); g.stroke();
    }
    // 回転する区切り弧（思考中に速くなる）
    g.lineWidth = 1.5;
    for (let k = 0; k < 3; k++){
      const a0 = S.gimRot * (k % 2 ? -.6 : .9) + k * TAU / 3;
      g.strokeStyle = rgb(.25 + .35 * S.gim);
      g.beginPath(); g.arc(cxp, ringY, RI - 14, a0, a0 + .5); g.stroke();
    }
    // 走査ビーム
    if (S.scan > .03){
      const a = S.scanA;
      const grd = g.createConicGradient ? g.createConicGradient(a - .6, cxp, ringY) : null;
      if (grd){
        grd.addColorStop(0, rgb(0)); grd.addColorStop(.095, rgb(.16 * S.scan)); grd.addColorStop(.096, rgb(0)); grd.addColorStop(1, rgb(0));
        g.fillStyle = grd; g.beginPath(); g.arc(cxp, ringY, RI - 1, 0, TAU); g.fill();
      }
    }
    // 照準ブラケット
    const fb = R * 1.02 * S.frame, bl = 8;
    g.strokeStyle = rgb(.6); g.lineWidth = 1.2;
    for (const [sxn, syn] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
      const x0 = cxp + sxn * fb, y0 = cyp + syn * fb;
      g.beginPath(); g.moveTo(x0 - sxn * bl, y0); g.lineTo(x0, y0); g.lineTo(x0, y0 - syn * bl); g.stroke();
    }

    /* ── 粒子 ── */
    g.globalCompositeOperation = "lighter";
    let visible = 0;
    for (const p of pts){
      p.k += ((p.seed < S.assemble ? 1 : 0) - p.k) * Math.min(1, dt * 2.6);
      const k = p.k, j = 1 + S.jitter * Math.sin(t * .013 + p.seed * 60);
      const [x1, y1, z2] = proj(lerp(p.sx, p.x, k) * j, lerp(p.sy, p.y, k) * j, lerp(p.sz, p.z, k) * j, cy, sy, cx, sx);
      const s = 1 + z2 * .24, d = (z2 + 1) / 2;
      const tw = reduce ? 1 : .72 + .28 * Math.sin(t * .0028 + p.tw);
      const a = (.08 + .92 * d * d) * S.bright * (.3 + .7 * k) * tw;
      if (a < .02) continue;
      if (k > .9) visible++;
      const m = .55 + .45 * d;
      g.fillStyle = `rgba(${Math.round(cr*m + (255-cr)*d*.45)},${Math.round(cg*m + (255-cg)*d*.45)},${Math.round(cb*m + (255-cb)*d*.3)},${Math.min(1, a)})`;
      const size = .6 + 1.6 * d + S.energy * .9;
      g.fillRect(cxp + x1 * R * s - size / 2, cyp + y1 * R * s - size / 2, size, size);
    }

    /* ── ジンバル ── */
    g.globalCompositeOperation = "source-over";
    for (const gm of gimbals){
      const rot = S.gimRot * gm.spd * 2;
      const ct = Math.cos(gm.tilt + rot * .3), st = Math.sin(gm.tilt + rot * .3);
      const cyw = Math.cos(gm.yaw + rot), syw = Math.sin(gm.yaw + rot);
      const P = u => {
        let x = Math.cos(u) * gm.r, y = 0, z = Math.sin(u) * gm.r;
        [y, z] = [y * ct - z * st, y * st + z * ct];
        [x, z] = [x * cyw + z * syw, -x * syw + z * cyw];
        const [x1, y1, z2] = proj(x, y, z, cy, sy, cx, sx), s = 1 + z2 * .18;
        return [cxp + x1 * R * s, cyp + y1 * R * s, (z2 / gm.r + 1) / 2];
      };
      const n = 96;
      let prev = P(0);
      for (let i = 1; i <= n; i++){
        const cur = P(i / n * TAU), d = (prev[2] + cur[2]) / 2;
        g.strokeStyle = rgb((.05 + .55 * d * d) * S.gim * S.bright);
        g.lineWidth = .6 + 1.4 * d;
        g.beginPath(); g.moveTo(prev[0], prev[1]); g.lineTo(cur[0], cur[1]); g.stroke();
        prev = cur;
      }
      // 刻み（ブロック状の突起）
      for (let i = 0; i < gm.notches; i++){
        const [px, py, d] = P(i / gm.notches * TAU);
        const sz = 2 + 2.5 * d;
        g.fillStyle = rgb((.1 + .8 * d) * S.gim * S.bright);
        g.fillRect(px - sz / 2, py - sz / 2, sz, sz);
      }
    }

    // 波紋
    for (let i = waves.length - 1; i >= 0; i--){
      const w = waves[i]; w.r += dt * 1.5; w.a -= dt * 1.3;
      if (w.a <= 0){ waves.splice(i, 1); continue; }
      g.strokeStyle = rgb(w.a * .45); g.lineWidth = 1;
      g.beginPath(); g.arc(cxp, cyp, R * w.r, 0, TAU); g.stroke();
    }

    // テレメトリ（10回/秒）
    if (t - teleT > 100){
      teleT = t;
      const deg = ((S.rot * 180 / Math.PI) % 360 + 360) % 360, tl = S.tilt * 180 / Math.PI;
      $("#tAtt").textContent = `${pad(deg, 3)}° / ${tl < 0 ? "-" : "+"}${pad(tl, 2)}°`;
      $("#tPts").textContent = pad(visible, 4);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    el: cv,
    set(mode){ S.mode = mode; if (mode !== "load"){ S.assemble = 1; S.progress = 0; } },
    progress(p){ S.mode = "load"; S.progress = p; S.assemble = Math.max(.03, p); },
    pulse(){ S.energy = Math.min(1, S.energy + .3); },
    wave(){ if (waves.length < 4) waves.push({ r:1.02, a:1 }); },
  };
})();

const TAGS = { off:"待機", loading:"起動中", ready:"稼働", busy:"演算", error:"異常" };
let convo = false;          // 会話モード（聞く→答える→読み上げる→また聞く）
function status(main, sub, err){
  $("#sMain").textContent = main; $("#sSub").textContent = sub || "";
  $("#status").classList.toggle("err", !!err);
  $("#tag").textContent = TAGS[phase] || "待機";
}

/* ══ 会話表示 ══ */
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const inline = s => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
const clock = ts => { const d = new Date(ts); return `${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}:${pad(d.getSeconds(),2)}`; };
function render(text){
  let out = "", last = 0, m;
  const re = /```([\w+#.-]*)\n?([\s\S]*?)(?:```|$)/g;
  while ((m = re.exec(text))){
    out += inline(text.slice(last, m.index).replace(/\n+$/, "\n"));
    out += `<div class="codebox"><div class="bar"><span>${esc(m[1] || "code")}</span><button class="copy" type="button">コピー</button></div><pre>${esc(m[2].replace(/\n$/, ""))}</pre></div>`;
    last = re.lastIndex;
    if (m[0].length === 0) break;
  }
  return out + inline(text.slice(last).replace(/^\n+/, ""));
}
function addMsg(role, text, h){
  $("#log").querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + role;
  let meta = "";
  if (role === "user" || role === "assistant"){
    const no = pad(history.filter(x => x.role === role).indexOf(h) + 1 || history.filter(x => x.role === role).length, 3);
    meta = `<div class="meta"><b>${role === "user" ? "入力" : "応答"} ${no}</b><span class="ts">${h?.t ? clock(h.t) : ""}</span></div>`;
  }
  el.innerHTML = meta + `<div class="body"></div>`;
  el.querySelector(".body").innerHTML = render(text);
  $("#log").appendChild(el); scrollDown(true);
  return el;
}
/* ══ 字幕 ══ */
const plain = t => t.replace(/```[\s\S]*?(```|$)/g, "").replace(/`([^`]*)`/g, "$1").replace(/\*\*/g, "")
  .replace(/^#+\s*/gm, "").replace(/\n{2,}/g, "\n").trim();
function caption(user, ai, live){
  if (user !== null) $("#capUser").textContent = user;
  if (ai !== null){
    const el = $("#capAi");
    el.textContent = plain(ai);
    el.classList.toggle("live", !!live);
    el.scrollTop = el.scrollHeight;
    el.classList.toggle("over", el.scrollHeight > el.clientHeight + 2);
    $("#capMore").hidden = !/```/.test(ai);
  }
  $("#capHint").hidden = !history.length;
}
function captionLast(){
  const u = [...history].reverse().find(h => h.role === "user");
  const a = [...history].reverse().find(h => h.role === "assistant");
  caption(u ? u.content : "", a && history.indexOf(a) > history.indexOf(u) ? a.content : "");
}
function scrollDown(force){
  const l = $("#log");
  if (force || l.scrollHeight - l.scrollTop - l.clientHeight < 80) l.scrollTop = l.scrollHeight;
}
function showEmpty(){
  const p = PROJECTS.find(x => x.key === projectKey);
  $("#log").innerHTML = `<div class="empty">${engine
    ? `相談先：${esc(p.name)}<br>入力するか、マイクをタップして会話を始めてください`
    : `コアをタップすると起動します<br>初回のみモデルのダウンロードに数分かかります`}</div>`;
  if (!history.length) caption("", engine ? "" : "", false);
}
function renderHistory(){
  $("#log").innerHTML = "";
  captionLast();
  if (!history.length) return showEmpty();
  history.forEach(h => addMsg(h.role, h.content, h));
}
$("#log").addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const code = b.closest(".codebox").querySelector("pre").textContent;
  try { await navigator.clipboard.writeText(code); }
  catch { const t = document.createElement("textarea"); t.value = code; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  b.textContent = "コピー済み"; b.classList.add("done");
  setTimeout(() => { b.textContent = "コピー"; b.classList.remove("done"); }, 1500);
});

// スワイプ：字幕を上へ→開く、見出しを下へ→閉じる
function swipe(el, dir, fn){
  let y0 = null;
  el.addEventListener("pointerdown", e => y0 = e.clientY);
  el.addEventListener("pointerup", e => { if (y0 !== null && (e.clientY - y0) * dir > 40) fn(); y0 = null; });
  el.addEventListener("pointercancel", () => y0 = null);
}

function syncInfo(){

/* ══ 起動 ══ */
async function checkGPU(){
  if (!navigator.gpu) return false;
  try { const ad = await navigator.gpu.requestAdapter(); if (!ad) return false; f16 = ad.features.has("shader-f16"); return true; }
  catch { return false; }
}
async function boot(){
  if (phase === "loading" || phase === "busy") return;
  if (!(await checkGPU())){
    phase = "error"; sphere.set("error"); $("#tGpu").textContent = "非対応";
    status("起動できません", "このブラウザはWebGPU非対応です", true);
    addMsg("err", "WebGPUが使えないため、AIを動かせません。iPhoneはiOS 26以降のSafari、パソコンは最新のChromeかEdgeで開いてください。");
    return;
  }
  $("#tGpu").textContent = "WebGPU " + (f16 ? "16bit" : "32bit");
  phase = "loading"; setInput(); sphere.progress(0); sphere.wave();
  status("000%", "モデルを読み込んでいます");
  try {
    if (!webllm) webllm = await import("https://esm.run/@mlc-ai/web-llm@0.2.78");
    const list = webllm.prebuiltAppConfig.model_list.map(m => m.model_id);
    const base = $("#model").value;
    const id = (f16 ? ["q4f16_1","q4f32_1"] : ["q4f32_1","q4f16_1"]).map(q => `${base}-${q}-MLC`).find(c => list.includes(c));
    if (!id) throw new Error("選んだモデルがこのバージョンのWebLLMに見つかりません。設定で別のモデルを選んでください。");
    const progress = r => {
      const p = r.progress ?? 0;
      sphere.progress(p);
      status(pad(p * 100, 3) + "%", /cache/i.test(r.text || "") ? "端末から読み込んでいます" : "モデルを読み込んでいます");
    };
    if (engine){ engine.setInitProgressCallback?.(progress); await engine.reload(id); }
    else engine = await webllm.CreateMLCEngine(id, { initProgressCallback: progress });
    loadedId = id; store.set("aibo:booted", true);
    status("最終調整中", "最初の返答を速くするための準備です");
    try { await engine.chat.completions.create({ messages:[{ role:"system", content:BASE_PROMPT }, { role:"user", content:"はい" }], max_tokens:1 }); await engine.resetChat?.(); } catch {}
    phase = "ready"; sphere.set("ready"); sphere.pulse(); sphere.wave();
    status("待機中", MODELS.find(m => id.startsWith(m.base))?.short + "モデルで稼働");
    if (!history.length) showEmpty();
  } catch (err){
    phase = engine ? "ready" : "error";
    sphere.set(engine ? "ready" : "error");
    status("起動できません", "詳細は下に表示しています", true);
    const msg = String(err?.message || err);
    addMsg("err", "起動に失敗しました：" + msg +
      (/memory|OOM|Device was lost/i.test(msg) ? "\nメモリ不足の可能性があります。設定で「軽量」を選び、他のタブを閉じてからコアをタップしてください。" : "") +
      (/fetch|network|Failed to load/i.test(msg) ? "\nモデルのダウンロードに失敗しました。通信環境を確認してください。" : ""));
  } finally { setInput(); }
}
sphere.el.addEventListener("tap", () => {
  if (phase === "off" || phase === "error") boot().then(afterBoot);
  else { sphere.pulse(); sphere.wave(); }
});

/* ══ 送信 ══ */
const ICON_SEND = $("#sendBtn").innerHTML;
const ICON_MIC = $("#micBtn").innerHTML;
const ICON_STOP = `<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" fill="currentColor"/></svg>`;
function setInput(){
  const ready = phase === "ready", busy = phase === "busy";
  $("#input").disabled = !ready || convo;
  const mic = $("#micBtn");
  mic.disabled = !engine || phase === "loading";
  mic.classList.toggle("convo", convo);
  const stopMode = busy && !convo;
  mic.classList.toggle("stop", stopMode);
  if (mic.dataset.mode !== String(stopMode)){
    mic.dataset.mode = String(stopMode);
    mic.innerHTML = stopMode ? ICON_STOP : ICON_MIC;
  }
  mic.setAttribute("aria-label", stopMode ? "回答を止める" : convo ? "会話を終了" : "会話を始める");
  $("#input").placeholder = engine ? "質問を入力" : "起動すると質問できます";
  const sb = $("#sendBtn");
  sb.classList.toggle("stop", busy); sb.innerHTML = busy ? ICON_STOP : ICON_SEND;
  sb.setAttribute("aria-label", busy ? "回答を止める" : "送信");
  sb.disabled = busy ? false : !(ready && $("#input").value.trim());
  $("#tag").textContent = convo ? "会話" : TAGS[phase];
}
function systemPrompt(){
  const p = PROJECTS.find(x => x.key === projectKey), memo = $("#memo").value.trim();
  let s = BASE_PROMPT;
  if (p?.ctx) s += "\n\n相談中のアプリ：" + p.ctx;
  if (memo) s += "\n補足メモ：" + memo;
  if (convo) s += "\n\n今は音声で会話しています。前置きなしで、話し言葉の1〜2文で答えてください。記号や箇条書きは使わないでください。コードは本当に必要なときだけ短く示してください。";
  return s;
}
async function send(){
  const text = $("#input").value.trim();
  if (!text || phase !== "ready") return;
  $("#input").value = ""; autoGrow();
  const uh = { role:"user", content:text, t:Date.now() };
  history.push(uh); addMsg("user", text, uh);
  caption(text, "", true);
  phase = "busy"; setInput(); sphere.set("think"); sphere.wave();
  status("演算中", "回答を組み立てています");

  const ah = { role:"assistant", content:"", t:Date.now() };
  const el = addMsg("assistant", "", ah), body = el.querySelector(".body");
  el.querySelector(".meta b").textContent = "応答 " + pad(history.filter(x => x.role === "assistant").length + 1, 3);
  body.classList.add("cursor");
  let out = "", n = 0; const t0 = performance.now();
  const talk = convo && $("#speakOn").checked && "speechSynthesis" in window;
  speech.reset();
  try {
    const turns = convo ? 4 : HISTORY_TURNS;   // 会話中は読み込む履歴を減らして返答を速く
    const messages = [{ role:"system", content:systemPrompt() }, ...history.slice(-turns).map(({ role, content }) => ({ role, content }))];
    const stream = await engine.chat.completions.create({ messages, stream:true, temperature:0.3, max_tokens: convo ? 180 : 1024 });
    for await (const c of stream){
      const d = c.choices?.[0]?.delta?.content || "";
      if (!d) continue;
      out += d; n++;
      body.innerHTML = render(out);
      caption(null, out, true);
      if (n % 3 === 0) sphere.pulse();
      if (talk) speech.pump(out, false);
      const sec = (performance.now() - t0) / 1000, tps = sec > 0 ? n / sec : 0;
      $("#tTps").textContent = tps.toFixed(1).padStart(4, "0") + " t/s";
      status("回答中", `${n} トークン`);
      scrollDown();
    }
  } catch (err){
    out += (out ? "\n\n" : "") + "［中断：" + (err?.message || err) + "］";
    body.innerHTML = render(out);
  } finally {
    body.classList.remove("cursor");
    if (out){ ah.content = out; history.push(ah); }
    caption(null, out, false);
    store.set("aibo:hist:" + projectKey, history.slice(-40));
    phase = "ready"; setInput();
    const took = `前回の回答 ${((performance.now() - t0) / 1000).toFixed(1)}秒 ／ ${n} トークン`;
    if (talk && out && convo){
      speech.pump(out, true);
      await speech.drained();
    }
    if (convo){ setTimeout(() => convo && phase === "ready" && listen(true), 120); }
    else { sphere.set("ready"); status("待機中", took); }
  }
}
$("#sendBtn").addEventListener("click", () => {
  if (phase === "busy"){ engine?.interruptGenerate(); speech.stop(); }
  else send();
});
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); } });
function autoGrow(){ const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * .3) + "px"; }
$("#input").addEventListener("input", () => { autoGrow(); setInput(); });

/* ══ 会話（音声入力＋読み上げ） ══ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;

// 読み上げ：回答を文ごとに区切り、生成と並行して話す
const speech = (() => {
  const syn = window.speechSynthesis;
  let spoken = 0, pending = 0, idle = null, beat = null;
  const jaVoices = () => (syn?.getVoices() || []).filter(v => /^ja|[-_]JP/i.test(v.lang) || /Kyoko|O-?ren|Otoya|Hattori/i.test(v.name));
  // 選んだ声。未選択なら声を指定せず、端末の標準の声に任せる
  const chosen = () => { const id = store.get("aibo:voice", ""); return id ? jaVoices().find(v => v.voiceURI === id) || null : null; };
  function fillVoices(){
    const sel = $("#voiceSel"), cur = store.get("aibo:voice", "");
    sel.innerHTML = ""; sel.add(new Option("端末の標準", ""));
    jaVoices().forEach(v => sel.add(new Option(v.name + (v.localService ? "" : "（通信）"), v.voiceURI)));
    sel.value = [...sel.options].some(o => o.value === cur) ? cur : "";
    const all = syn?.getVoices() || [];
    $("#voiceInfo").textContent = `この端末がブラウザに渡している声：日本語 ${jaVoices().length}件 ／ 全言語 ${all.length}件`;
  }
  // iPhoneは声の一覧が遅れて届くことがあるので、数秒間取り直す
  function refill(){ let n = 0; const id = setInterval(() => { fillVoices(); if (++n >= 6) clearInterval(id); }, 500); }
  if (syn){ fillVoices(); syn.addEventListener?.("voiceschanged", fillVoices); }
  $("#voiceSel").addEventListener("change", e => store.set("aibo:voice", e.target.value));
  $("#voiceTest").addEventListener("click", () => {
    if (!syn) return;
    syn.cancel();
    const u = new SpeechSynthesisUtterance("コアです。この声で読み上げます。");
    u.lang = "ja-JP"; u.rate = +$("#rate").value; u.pitch = +$("#pitch").value; const v = chosen(); if (v) u.voice = v;
    syn.speak(u);
  });
  // 画面向けの記号を外し、コードは読まずに一言だけ添える
  const speakable = t => {
    t = t.replace(/```[\s\S]*?```/g, "。コードは履歴に表示しました。");
    const open = t.indexOf("```"); if (open >= 0) t = t.slice(0, open);
    return t.replace(/`([^`]*)`/g, "$1").replace(/\*\*/g, "").replace(/^#+\s*/gm, "").replace(/^\s*[-*・]\s+/gm, "");
  };
  function say(text){
    if (!syn) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = +$("#rate").value; u.pitch = +$("#pitch").value; const v = chosen(); if (v) u.voice = v;
    pending++;
    if (!beat){
      sphere.set("speak"); status("発話中", "マイクをタップすると会話を終了します");
      beat = setInterval(() => sphere.pulse(), 190);
    }
    u.onend = u.onerror = () => {
      if (--pending > 0) return;
      clearInterval(beat); beat = null;
      if (idle){ const f = idle; idle = null; f(); }
    };
    syn.speak(u);
  }
  return {
    reset(){ spoken = 0; },
    pump(text, final){
      const t = speakable(text);
      let end = spoken;
      if (final) end = t.length;
      else {
        for (let i = t.length - 1; i >= spoken; i--){ if ("。！？!?\n".includes(t[i])){ end = i + 1; break; } }
        // まだ一言も話していなければ、読点でも区切ってすぐ話し始める
        if (end === spoken && spoken === 0){ const c = t.indexOf("、", 8); if (c > 0) end = c + 1; }
      }
      if (end <= spoken) return;
      const seg = t.slice(spoken, end).replace(/\s+/g, " ").trim(); spoken = end;
      if (seg.replace(/[。、！？!?\s]/g, "")) say(seg);
    },
    drained(){ return pending === 0 ? Promise.resolve() : new Promise(r => idle = r); },
    stop(){ syn?.cancel(); pending = 0; clearInterval(beat); beat = null; if (idle){ const f = idle; idle = null; f(); } },
    fill(){ fillVoices(); refill(); },
    prime(){ if (syn){ const u = new SpeechSynthesisUtterance(""); u.volume = 0; syn.speak(u); } },  // iPhoneはタップ時に一度鳴らす必要がある
  };
})();

let actx = null;
function chime(freq, len){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + .02);
  } catch {}
}
function setListening(on){
  listening = on; $("#micBtn").classList.toggle("live", on);
  $("#micBtn").setAttribute("aria-label", convo ? "会話を終了" : "会話を始める");
  if (on){ sphere.set("listen"); status("聴取中", "話し終えると自動で送信します"); }
}
function startConvo(auto){
  if (!SR){
    if (auto) status("音声入力を使えません", "この表示モードでは音声認識が提供されていません", true);
    else addMsg("err", "この画面では音声入力が使えません。iPhoneはSafariで開くと使える場合があります。");
    return;
  }
  convo = true; speech.prime(); setInput();
  addMsg("note", "会話を開始しました");
  listen(auto);
}
function endConvo(msg){
  if (!convo) return;
  convo = false;
  try { rec?.abort(); } catch {}
  speech.stop();
  if (phase === "busy") engine?.interruptGenerate();
  setListening(false); setInput();
  sphere.set(phase === "error" ? "error" : "ready");
  status("待機中", msg || "会話を終了しました");
  addMsg("note", "会話を終了しました");
}
$("#micBtn").addEventListener("click", () => {
  if (phase === "busy" && !convo){ engine?.interruptGenerate(); return; }
  if (convo) return endConvo();
  if (!$("#typebar").hidden){ $("#typebar").hidden = true; $("#kbBtn").classList.remove("on"); }
  startConvo(false);
});

function listen(auto){
  if (!convo) return;
  let heard = false, silentEnd = false;
  rec = new SR(); rec.lang = "ja-JP"; rec.interimResults = true; rec.continuous = false;
  let hush = null;
  rec.onresult = e => {
    let txt = "", done = false;
    for (let i = 0; i < e.results.length; i++){ txt += e.results[i][0].transcript; done = e.results[i].isFinal; }
    $("#input").value = txt; autoGrow(); heard = true; sphere.pulse();
    caption(txt, null);
    // iPhone標準の区切りは遅いので、0.7秒黙ったら話し終えたとみなす
    clearTimeout(hush);
    hush = setTimeout(() => { try { rec.stop(); } catch {} }, done ? 150 : 700);
  };
  rec.onerror = e => {
    if (e.error === "aborted") return;
    if (e.error === "no-speech"){ silentEnd = true; return; }
    if (auto && /not-allowed|service-not-allowed/.test(e.error)){ convo = false; setInput(); askTap(); return; }
    const m = {
      "not-allowed":"マイクが許可されていません。ブラウザの設定でこのサイトのマイクを許可してください。",
      "service-not-allowed":"マイクが許可されていません。ブラウザの設定でこのサイトのマイクを許可してください。",
      "network":"音声認識サービスに接続できませんでした。通信環境を確認してください。",
      "audio-capture":"マイクが見つかりません。",
    }[e.error];
    addMsg("err", m || "音声入力でエラーが発生しました：" + e.error);
    endConvo("音声入力が止まりました");
  };
  rec.onend = () => {
    clearTimeout(hush);
    if (heard) chime(520, .07);
    setListening(false);
    if (!convo) return;
    if (heard && $("#input").value.trim()) send();
    else endConvo(silentEnd ? "しばらく声がなかったので会話を終了しました" : "");
  };
  try { rec.start(); setListening(true); sphere.wave(); chime(880, .06); }
  catch (err){ convo = false; setInput(); auto ? askTap() : addMsg("err", "音声入力を開始できませんでした：" + err.message); }
}
function askTap(){
  convo = false; setListening(false); setInput();
  status("タップで聞き取り開始", "画面のどこかをタップすると話しかけられます");
  $("#micBtn").classList.add("live");
  const cleanup = () => { document.removeEventListener("pointerup", go, true); $("#micBtn").classList.remove("live"); };
  const go = e => {
    if (e.target.closest("dialog, #openSettings, #micBtn")) return;   // マイクと設定はそれぞれの操作に任せる
    cleanup(); startConvo(false);
  };
  document.addEventListener("pointerup", go, true);
  $("#micBtn").addEventListener("click", cleanup, { once:true });
}

/* ══ 初期化 ══ */
const voiceLaunch = new URLSearchParams(location.search).has("voice");   // Siriのショートカット用
loadProject(); setInput();
checkGPU().then(ok => { $("#tGpu").textContent = ok ? "WebGPU " + (f16 ? "16bit" : "32bit") : "非対応"; });
// 起動が終わったら、そのまま会話（音声入力）を始める
function afterBoot(){
  if (phase === "ready" && !convo && (voiceLaunch || $("#autoListen").checked)) startConvo(true);
}
if (voiceLaunch || store.get("aibo:booted", false)) boot().then(afterBoot);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") setTimeout(afterBoot, 300);
  else if (convo) endConvo("アプリを離れたので会話を終了しました");
});
</script>
